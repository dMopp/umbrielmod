name: CI

on:
  push:
    branches: ["**"]   # tags are covered by the commit they point to
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 shellcheck
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Environment
        run: |
          uv venv --system-site-packages --python /usr/bin/python3
          uv sync
      - name: Tests
        run: uv run pytest -q
      - name: Installer lint
        run: shellcheck install.sh tools/release.sh
